services:
  # WebShield Backend API & Scanner Engine
  - type: web
    name: webshield-backend
    env: node
    rootDir: backend
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: MONGO_DB
        value: webshield_db
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false

  # WebShield Frontend User Interface
  - type: web
    name: webshield-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
