version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: webshield-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-webshield_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webshield_pass}
      POSTGRES_DB: ${POSTGRES_DB:-webshield_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-webshield_user} -d ${POSTGRES_DB:-webshield_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: webshield-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: webshield-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: ${NODE_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:-webshield_super_secret_jwt_key_2026_change_in_production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-webshield_user}:${POSTGRES_PASSWORD:-webshield_pass}@postgres:5432/${POSTGRES_DB:-webshield_db}
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:3000
      ALLOW_LOCAL_DEMO_TARGET: "true"
      DEMO_TARGET_HOST: demo-target:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: webshield-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

  demo-target:
    build:
      context: ./demo-target
      dockerfile: Dockerfile
    container_name: webshield-demo-target
    restart: always
    ports:
      - "8080:8080"

volumes:
  pgdata:
