version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: webshield-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-webshield_user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-webshield_pass}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-webshield_db}
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: webshield-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: webshield-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: ${NODE_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:-webshield_super_secret_jwt_key_2026_change_in_production}
      MONGODB_URI: mongodb://${MONGO_USER:-webshield_user}:${MONGO_PASSWORD:-webshield_pass}@mongodb:27017/${MONGO_DB:-webshield_db}?authSource=admin
      MONGO_DB: ${MONGO_DB:-webshield_db}
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:3000
      ALLOW_LOCAL_DEMO_TARGET: "true"
      DEMO_TARGET_HOST: demo-target:8080
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: webshield-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

  demo-target:
    build:
      context: ./demo-target
      dockerfile: Dockerfile
    container_name: webshield-demo-target
    restart: always
    ports:
      - "8080:8080"

volumes:
  mongodata:
